<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements Admin · 報告事項後台</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=1.1">
<style>
  body{
    background: var(--bg-deep);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 20px;
    max-width: 640px;
    margin: 0 auto;
  }
  h1{
    font-family: var(--font-display);
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .subtitle{
    color: var(--ink-dim);
    font-size: 0.85rem;
    margin: 0 0 24px;
  }

  /* --- PIN gate --- */
  #pinGate{
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 280px;
    margin: 60px auto;
    text-align: center;
  }
  #pinGate input{
    text-align: center;
    font-size: 1.4rem;
    letter-spacing: 0.3em;
    padding: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 0;
  }
  #pinError{ color: #e05a5a; font-size: 0.82rem; min-height: 1.2em; }

  /* --- shared controls --- */
  .btn2{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border: 1px solid var(--cyan);
    background: rgba(70, 212, 222, 0.08);
    color: var(--cyan);
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn2:active{ background: rgba(70, 212, 222, 0.2); }
  .btn2--danger{ border-color: #e05a5a; color: #e05a5a; background: rgba(224,90,90,0.08); }
  .btn2--danger:active{ background: rgba(224,90,90,0.2); }
  .btn2--ghost{ border-color: var(--line); color: var(--ink-dim); background: none; }

  /* --- app shell (hidden until unlocked) --- */
  #app{ display: none; }
  .toolbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .header-toggle{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--ink-faint);
  }

  /* --- list --- */
  #list{ display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .item{
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    padding: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .item__info{ min-width: 0; }
  .item__title{ font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
  .item__date{ color: var(--cyan); font-family: var(--font-mono); font-size: 0.72rem; margin-top: 2px; }
  .item__actions{ display: flex; gap: 6px; flex-shrink: 0; }
  .item__actions .btn2{ padding: 6px 10px; font-size: 0.75rem; }
  #status{ color: var(--ink-dim); font-size: 0.85rem; padding: 12px 0; }

  /* --- form --- */
  #formPanel{
    display: none;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 18px;
    margin-bottom: 24px;
  }
  #formPanel h2{ font-size: 1rem; margin: 0 0 14px; }
  .field{ margin-bottom: 14px; }
  .field label{
    display: block;
    font-size: 0.75rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
  }
  .field input, .field textarea, .field select{
    width: 100%;
    box-sizing: border-box;
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 9px 10px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    border-radius: 0;
    color-scheme: dark;
  }
  .field textarea{ min-height: 70px; resize: vertical; }
  .row2{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .imgPreview{ max-width: 120px; display: block; margin-top: 8px; border-radius: 6px; }
  .form-actions{ display: flex; gap: 10px; margin-top: 18px; }
  #uploadStatus{ font-size: 0.78rem; color: var(--ink-dim); margin-top: 6px; }
  .admin-version{ text-align: center; font-size: 0.7rem; opacity: 0.45; margin-top: 30px; font-family: var(--font-mono); }
</style>
</head>
<body>

  <div id="pinGate">
    <h1>Announcements Admin</h1>
    <p class="subtitle">報告事項後台</p>
    <input type="password" id="pinInput" inputmode="numeric" placeholder="PIN">
    <button class="btn2" id="unlockBtn">Unlock 解鎖</button>
    <p id="pinError"></p>
  </div>

  <div id="app">
    <h1>Announcements 報告事項</h1>
    <p class="subtitle">Add, edit, or remove items — changes go straight to the Google Sheet.</p>

    <div class="toolbar">
      <button class="btn2" id="addNewBtn">+ Add New 新增</button>
      <label class="header-toggle">
        <input type="checkbox" id="hasHeaderToggle">
        Sheet has header row 表格有標題列
      </label>
    </div>

    <div id="formPanel">
      <h2 id="formTitle">Add Announcement</h2>
      <div class="row2">
        <div class="field"><label>Title EN</label><input type="text" id="f_titleEn"></div>
        <div class="field"><label>標題 ZH</label><input type="text" id="f_titleZh"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Date 日期</label><input type="date" id="f_date"></div>
        <div class="field">
          <label>Time 時間 24hr (optional)</label>
          <div style="display:flex; gap:4px;">
            <select id="f_timeHour" style="flex:1;"></select>
            <select id="f_timeMin" style="flex:1;"></select>
          </div>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>Location 地點</label><input type="text" id="f_location"></div>
        <div class="field"><label>Fee 費用</label><input type="text" id="f_fee"></div>
      </div>
      <div class="field"><label>Content EN</label><textarea id="f_contentEn"></textarea></div>
      <div class="field"><label>內容 ZH</label><textarea id="f_contentZh"></textarea></div>
      <div class="field"><label>Link (optional)</label><input type="url" id="f_link" placeholder="https://"></div>
      <div class="field">
        <label>Image 圖片 (optional)</label>
        <input type="file" id="f_imageFile" accept="image/*">
        <input type="hidden" id="f_imageUrl">
        <img id="f_imagePreview" class="imgPreview" style="display:none">
        <p id="uploadStatus"></p>
      </div>
      <div class="form-actions">
        <button class="btn2" id="saveBtn">Save 儲存</button>
        <button class="btn2 btn2--ghost" id="cancelBtn">Cancel 取消</button>
      </div>
    </div>

    <div id="status"></div>
    <div id="list"></div>

    <hr style="border-color: var(--line); margin: 32px 0;">

    <h1>Church Stats 教會數據</h1>
    <p class="subtitle">這幾個欄位會顯示在 live.html 的「Church Stats」頁。</p>
    <div class="row2">
      <div class="field"><label>Prayer Meeting 禱告</label><input type="number" id="s_prayer"></div>
      <div class="field"><label>Children 兒崇</label><input type="number" id="s_children"></div>
    </div>
    <div class="field"><label>Adult 成人</label><input type="number" id="s_adult"></div>
    <div class="row2">
      <div class="field"><label>上週十一奉獻及堂費 ($)</label><input type="number" id="s_offeringLastWeek"></div>
      <div class="field"><label>上週特別奉獻 ($)</label><input type="number" id="s_offeringSpecial"></div>
    </div>
    <div class="field"><label>本月奉獻總金額 ($)</label><input type="number" id="s_offeringMonthTotal"></div>
    <div class="field"><label>2026 每月奉獻目標 ($)</label><input type="number" id="s_monthlyGoal"></div>
    <div class="field"><label>目標明細（文字）</label><input type="text" id="s_monthlyGoalBreakdown" placeholder="租金$2,000 薪金$7,350 事工支出$1,600"></div>
    <div class="row2">
      <div class="field"><label>本月支出金額 ($)</label><input type="number" id="s_monthExpense"></div>
      <div class="field"><label>目標差額 ($)</label><input type="number" id="s_monthGoalGap"></div>
    </div>
    <div class="row2">
      <div class="field"><label>銀行現存儲備（文字）</label><input type="text" id="s_bankReservePercent" placeholder="約 8%"></div>
      <div class="field"><label>儲備備註（文字）</label><input type="text" id="s_bankReserveNote" placeholder="以9月份支出預算比例計算"></div>
    </div>
    <div class="form-actions">
      <button class="btn2" id="statsSaveBtn">Save Stats 儲存數據</button>
    </div>
    <p id="statsStatus"></p>

  </div>
  <p class="admin-version">v1.6 · updated 2026-09-16</p>

<script>
  // TODO: this is your Apps Script Web App URL from the deployment step
  const API_URL = 'https://script.google.com/macros/s/AKfycbw6rT3UY-YmyxVY3g7hVOhpV3nQz8OT1NrJyac7VNRHywvt0xsd8FH0-tBo376zIYxB/exec';

  let PIN = '';
  let allRows = [];      // raw rows exactly as the sheet returns them
  let editingRowIndex = null; // 1-based sheet row currently being edited, or null when adding

  const pinGate = document.getElementById('pinGate');
  const app = document.getElementById('app');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');
  const hasHeaderToggle = document.getElementById('hasHeaderToggle');
  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const formPanel = document.getElementById('formPanel');

  // Populate the time dropdowns (replacing native <input type="time">, which has
  // a known iOS Safari bug where the wheel picker doesn't always commit a value).
  const hourSelect = document.getElementById('f_timeHour');
  const minSelect = document.getElementById('f_timeMin');
  hourSelect.innerHTML = '<option value="">--</option>' +
    Array.from({length: 24}, (_, i) => i).map(h => `<option value="${h}">${String(h).padStart(2,'0')}</option>`).join('');
  minSelect.innerHTML = '<option value="">--</option>' +
    Array.from({length: 12}, (_, i) => i * 5).map(m => `<option value="${m}">${String(m).padStart(2,'0')}</option>`).join('');

  // Reads the 2 dropdowns as a 24-hour "HH:MM" string, or '' if time isn't set.
  function readTimeFields() {
    const h = document.getElementById('f_timeHour').value;
    const m = document.getElementById('f_timeMin').value;
    if (h === '' || m === '') return '';
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  // Writes a stored 24-hour "HH:MM" string back into the 2 dropdowns.
  function writeTimeFields(hhmm) {
    if (!hhmm || !/^\d{1,2}:\d{2}$/.test(hhmm)) {
      document.getElementById('f_timeHour').value = '';
      document.getElementById('f_timeMin').value = '';
      return;
    }
    const [h, m] = hhmm.split(':').map(Number);
    document.getElementById('f_timeHour').value = String(h);
    document.getElementById('f_timeMin').value = String(Math.round(m / 5) * 5 % 60);
  }
  const formTitle = document.getElementById('formTitle');

  document.getElementById('unlockBtn').addEventListener('click', unlock);
  pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  function unlock() {
    const val = pinInput.value.trim();
    if (!val) { pinError.textContent = 'Enter your PIN 請輸入 PIN'; return; }
    PIN = val;
    pinGate.style.display = 'none';
    app.style.display = 'block';
    loadList();
    loadStats();
  }

  hasHeaderToggle.addEventListener('change', renderList);

  function loadList() {
    statusEl.textContent = 'Loading… 載入中…';
    listEl.innerHTML = '';
    fetch(API_URL)
      .then(res => res.text())
      .then(text => {
        let data;
        try { data = JSON.parse(text); }
        catch (e) { statusEl.textContent = 'Load failed — server said: ' + text.slice(0, 200); return; }
        allRows = Array.isArray(data) ? data : [];
        statusEl.textContent = '';
        renderList();
      })
      .catch(err => { statusEl.textContent = "Couldn't load the list (network): " + err.message; });
  }

  function renderList() {
    const skip = hasHeaderToggle.checked ? 1 : 0;
    const items = allRows.slice(skip);
    if (!items.length) {
      listEl.innerHTML = '';
      statusEl.textContent = 'No announcements yet. 目前沒有報告事項。';
      return;
    }
    statusEl.textContent = '';
    listEl.innerHTML = items.map((row, i) => {
      const sheetRow = i + skip + 1; // 1-based actual sheet row
      const titleEn = row[0] || '(untitled)';
      const titleZh = row[1] || '';
      const date = row[2] || '';
      const time = row[3] || '';
      return `
        <div class="item">
          <div class="item__info">
            <div class="item__title">${escapeHtml(titleEn)}${titleZh ? ' ' + escapeHtml(titleZh) : ''}</div>
            ${(date || time) ? `<div class="item__date">${escapeHtml([date, time].filter(Boolean).join(' '))}</div>` : ''}
          </div>
          <div class="item__actions">
            <button class="btn2" data-edit="${sheetRow}">Edit</button>
            <button class="btn2 btn2--danger" data-delete="${sheetRow}">Delete</button>
          </div>
        </div>`;
    }).join('');

    listEl.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => openEdit(parseInt(btn.dataset.edit, 10)));
    });
    listEl.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', () => deleteRow(parseInt(btn.dataset.delete, 10)));
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // --- add / edit form ---
  document.getElementById('addNewBtn').addEventListener('click', () => openForm(null));
  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  document.getElementById('saveBtn').addEventListener('click', save);

  function openForm(rowIndex) {
    editingRowIndex = rowIndex;
    formTitle.textContent = rowIndex ? 'Edit Announcement' : 'Add Announcement';
    formPanel.style.display = 'block';
    formPanel.scrollIntoView({ behavior: 'smooth' });
  }

  function closeForm() {
    formPanel.style.display = 'none';
    editingRowIndex = null;
    ['f_titleEn','f_titleZh','f_date','f_location','f_fee','f_contentEn','f_contentZh','f_link','f_imageUrl']
      .forEach(id => document.getElementById(id).value = '');
    writeTimeFields('');
    document.getElementById('f_imageFile').value = '';
    document.getElementById('f_imagePreview').style.display = 'none';
    document.getElementById('uploadStatus').textContent = '';
  }

  function openEdit(sheetRow) {
    const row = allRows[sheetRow - 1] || [];
    document.getElementById('f_titleEn').value = row[0] || '';
    document.getElementById('f_titleZh').value = row[1] || '';
    document.getElementById('f_date').value = row[2] || '';
    writeTimeFields(row[3] || '');
    document.getElementById('f_location').value = row[4] || '';
    document.getElementById('f_fee').value = row[5] || '';
    document.getElementById('f_contentEn').value = row[6] || '';
    document.getElementById('f_contentZh').value = row[7] || '';
    document.getElementById('f_link').value = row[8] || '';
    document.getElementById('f_imageUrl').value = row[9] || '';
    const preview = document.getElementById('f_imagePreview');
    if (row[9]) { preview.src = row[9]; preview.style.display = 'block'; } else { preview.style.display = 'none'; }
    openForm(sheetRow);
  }

  // --- image upload ---
  // Resize/compress in-browser first: a full-res iPhone photo can be several MB,
  // which as base64 is large enough to fail ("Load failed") over some mobile
  // connections. Shrinking to a max 1600px JPEG keeps uploads small and reliable.
  document.getElementById('f_imageFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const uploadStatus = document.getElementById('uploadStatus');
    uploadStatus.textContent = 'Preparing image… 處理圖片中…';

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1600;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const base64 = canvas.toDataURL('image/jpeg', 0.82).split(',')[1];
        const sizeKB = Math.round(base64.length * 0.75 / 1024);

        uploadStatus.textContent = `Uploading (${sizeKB}KB)… 上傳中…`;
        const t0 = performance.now();
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            pin: PIN,
            action: 'uploadImage',
            base64: base64,
            mimeType: 'image/jpeg',
            fileName: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg'
          })
        })
          .then(res => res.text())
          .then(text => {
            let data;
            try { data = JSON.parse(text); }
            catch (e) { uploadStatus.textContent = 'Upload failed — server said: ' + text.slice(0, 200); return; }
            if (data.error) { uploadStatus.textContent = 'Upload failed: ' + data.error; return; }
            document.getElementById('f_imageUrl').value = data.url;
            const preview = document.getElementById('f_imagePreview');
            preview.src = data.url;
            preview.style.display = 'block';
            uploadStatus.textContent = 'Uploaded ✓ 已上傳';
          })
          .catch(err => {
            const elapsed = Math.round(performance.now() - t0);
            uploadStatus.textContent = `Upload failed (network) after ${elapsed}ms, size ${sizeKB}KB: ${err.message}`;
          });
      };
      img.onerror = () => { uploadStatus.textContent = "Couldn't read that image. 無法讀取這張圖片。"; };
      img.src = reader.result;
    };
    reader.onerror = () => { uploadStatus.textContent = "Couldn't read that file. 無法讀取檔案。"; };
    reader.readAsDataURL(file);
  });

  // --- save (add or update) ---
  function save() {
    const row = [
      document.getElementById('f_titleEn').value,
      document.getElementById('f_titleZh').value,
      document.getElementById('f_date').value,
      readTimeFields(),
      document.getElementById('f_location').value,
      document.getElementById('f_fee').value,
      document.getElementById('f_contentEn').value,
      document.getElementById('f_contentZh').value,
      document.getElementById('f_link').value,
      document.getElementById('f_imageUrl').value
    ];
    console.log('Saving row:', row);
    statusEl.textContent = `Saving… date="${row[2]}" time="${row[3]}"`;
    const body = editingRowIndex
      ? { pin: PIN, action: 'update', rowIndex: editingRowIndex, row: row }
      : { pin: PIN, action: 'add', row: row };

    fetch(API_URL, { method: 'POST', body: JSON.stringify(body) })
      .then(res => res.text())
      .then(text => {
        let data;
        try { data = JSON.parse(text); }
        catch (e) { statusEl.textContent = 'Save failed — server said: ' + text.slice(0, 200); return; }
        if (data.error) { statusEl.textContent = 'Save failed: ' + data.error; return; }
        closeForm();
        loadList();
      })
      .catch(err => { statusEl.textContent = 'Save failed (network): ' + err.message; });
  }

  function deleteRow(sheetRow) {
    if (!confirm('Delete this announcement? 確定要刪除嗎？')) return;
    statusEl.textContent = 'Deleting… 刪除中…';
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ pin: PIN, action: 'delete', rowIndex: sheetRow }) })
      .then(res => res.text())
      .then(text => {
        let data;
        try { data = JSON.parse(text); }
        catch (e) { statusEl.textContent = 'Delete failed — server said: ' + text.slice(0, 200); return; }
        if (data.error) { statusEl.textContent = 'Delete failed: ' + data.error; return; }
        loadList();
      })
      .catch(() => { statusEl.textContent = 'Delete failed. 刪除失敗。'; });
  }

  // --- Church Stats ---
  const statsFieldIds = [
    's_prayer', 's_children', 's_adult',
    's_offeringLastWeek', 's_offeringSpecial', 's_offeringMonthTotal',
    's_monthlyGoal', 's_monthlyGoalBreakdown',
    's_monthExpense', 's_monthGoalGap',
    's_bankReservePercent', 's_bankReserveNote'
  ];
  const statsStatusEl = document.getElementById('statsStatus');

  function loadStats() {
    statsStatusEl.textContent = 'Loading… 載入中…';
    fetch(`${API_URL}?action=stats`)
      .then(res => res.text())
      .then(text => {
        let data;
        try { data = JSON.parse(text); }
        catch (e) { statsStatusEl.textContent = 'Load failed — server said: ' + text.slice(0, 200); return; }
        if (data.error) { statsStatusEl.textContent = 'Load failed: ' + data.error; return; }
        statsFieldIds.forEach((id, i) => {
          document.getElementById(id).value = (data[i] != null) ? data[i] : '';
        });
        statsStatusEl.textContent = '';
      })
      .catch(err => { statsStatusEl.textContent = 'Load failed (network): ' + err.message; });
  }

  document.getElementById('statsSaveBtn').addEventListener('click', () => {
    const row = statsFieldIds.map(id => {
      const el = document.getElementById(id);
      return el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value;
    });
    statsStatusEl.textContent = 'Saving… 儲存中…';
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ pin: PIN, action: 'updateStats', row: row }) })
      .then(res => res.text())
      .then(text => {
        let data;
        try { data = JSON.parse(text); }
        catch (e) { statsStatusEl.textContent = 'Save failed — server said: ' + text.slice(0, 200); return; }
        if (data.error) { statsStatusEl.textContent = 'Save failed: ' + data.error; return; }
        statsStatusEl.textContent = 'Saved ✓ 已儲存';
        setTimeout(() => { statsStatusEl.textContent = ''; }, 2000);
      })
      .catch(err => { statsStatusEl.textContent = 'Save failed (network): ' + err.message; });
  });
</script>
</body>
</html>
