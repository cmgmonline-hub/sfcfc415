<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>City Mission · 城市使命四方福音會</title>
<meta name="description" content="City Mission — swipe through the key info.">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="assets/SFCFC-logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=1.1">
<style>
  /* live.html — swipeable single-screen slides, mobile-first */
  html, body{ height:100%; overflow:hidden; overscroll-behavior: none; }
  body{ display:flex; flex-direction:column; }

  .live-shell{
    flex: 1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  .live-track{
    flex:1;
    min-height: 0;
    display:flex;
    height:100%;
    overflow-x: scroll;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .live-track::-webkit-scrollbar{ display:none; }

  .live-slide{
    flex: 0 0 100%;
    max-width: 100%;
    height:100%;
    min-height: 0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding: clamp(16px, 5vh, 28px) 24px;
    box-sizing:border-box;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
  }
  .live-slide__inner{ max-width: 440px; margin: 0 auto; width:100%; }

  .live-slide.live-slide--scroll{
    justify-content: flex-start;
    overflow-y: auto;
    padding-top: clamp(20px, 4vh, 32px);
    padding-bottom: clamp(20px, 4vh, 32px);
  }

  .live-slide.live-slide--poster{
    padding: 0;
  }
  .live-slide.live-slide--intro{
    position: relative;
    justify-content: flex-end;
    padding-bottom: clamp(28px, 6vh, 44px);
    background-image:
      linear-gradient(180deg, rgba(10,12,20,0.55) 0%, rgba(10,12,20,0.78) 55%, var(--bg-deep) 100%),
      url("assets/SFCFC-live-bg.jpg?v=2");
    background-size: cover;
    background-position: center;
  }
  .live-slide--poster .live-slide__inner{
    max-width: 100%;
    height: 100%;
    width: 100%;
    margin: 0;
    background: var(--bg-deep);
  }
  .live-poster{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .live-poster-cta{
    margin-top: 10px;
    width: calc(100% - 48px);
    max-width: 320px;
  }
  .live-poster-cta--map{
    border-color: var(--cyan) !important;
    color: var(--cyan) !important;
    background: rgba(70,212,222,0.1) !important;
  }
  .live-poster-cta--map:hover{
    background: rgba(70,212,222,0.18) !important;
  }

  /* --- bottom control bar: just the dots now --- */
  .live-bottom{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 18px 0 8px;
  }

  .live-dots{
    display:flex; justify-content:center; gap: 8px;
  }
  .live-dots button{
    width:8px; height:8px; border-radius:50%;
    background: var(--line);
    border:none; padding:0; cursor:pointer;
    transition: background 0.25s, transform 0.25s;
  }
  .live-dots button.is-active{
    background: var(--grad);
    transform: scale(1.3);
  }

  /* --- swipe arrows: edge-mounted, no button chrome, neon glow --- */
  .live-arrow{
    position:absolute;
    top:50%;
    transform: translateY(-50%);
    width: 44px; height:44px;
    background: none;
    border: none;
    padding:0;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    z-index:6;
    transition: filter 0.25s, transform 0.15s, opacity 0.25s;
  }
  .live-arrow--prev{
    left: 8px;
    color: var(--gold);
    animation: neon-flicker 2.2s ease-in-out infinite;
  }
  .live-arrow--next{
    right: 8px;
    color: var(--cyan);
    animation: neon-flicker 2.2s ease-in-out infinite;
    animation-delay: 0.4s;
  }
  @keyframes neon-flicker{
    0%, 100%{
      filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 10px currentColor) drop-shadow(0 0 18px currentColor);
      opacity: 0.35;
    }
    50%{
      filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 20px currentColor) drop-shadow(0 0 36px currentColor);
      opacity: 0.55;
    }
  }
  .live-arrow:hover{
    animation-play-state: paused;
    filter: drop-shadow(0 0 10px currentColor) drop-shadow(0 0 26px currentColor) drop-shadow(0 0 44px currentColor);
    opacity: 0.85;
  }
  .live-arrow:active{ transform: translateY(-50%) scale(0.9); }
  .live-arrow.is-hidden{ opacity:0.12; filter:none; animation:none; pointer-events:none; }
  .live-arrow svg{ width:34px; height:34px; stroke-width: 2.4; }

  /* --- header on every slide --- */
  .live-header{ text-align:center; margin-bottom: 26px; }
  .live-logo{
    width: clamp(200px, 55vw, 300px);
    max-height: 32vh;
    height: auto;
    object-fit:contain;
    border-radius:28px;
    margin: 0 auto 16px;
    display:block;
    animation: logoNeonPulse 2.4s ease-in-out infinite;
  }
  @keyframes logoNeonPulse{
    0%, 100% {
      filter: drop-shadow(0 0 4px rgba(255, 204, 51, 0.35)) drop-shadow(0 0 2px rgba(255, 204, 51, 0.5));
    }
    50% {
      filter: drop-shadow(0 0 10px rgba(255, 204, 51, 0.8)) drop-shadow(0 0 4px rgba(255, 204, 51, 0.9));
    }
  }
  @media (prefers-reduced-motion: reduce){
    .live-logo{ animation: none; filter: drop-shadow(0 0 5px rgba(255, 204, 51, 0.5)); }
  }
  .live-clock{
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin: 12px auto 0;
    padding: 10px 22px;
    color: var(--cyan);
  }
  .live-clock__time{
    font-family: var(--font-mono);
    font-size: 2.9rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    line-height: 1.05;
  }
  .live-clock__date{
    font-family: var(--font-mono);
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.85;
    line-height: 1.1;
    margin-top: 7px;
  }
  .live-clock__weather{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.88rem;
    letter-spacing: 0.03em;
    margin-top: 2px;
    padding-top: 5px;
    border-top: 1px solid rgba(70, 212, 222, 0.25);
    width: 100%;
    text-align: center;
    opacity: 0.9;
  }
  .live-clock__weather svg{
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    stroke: var(--cyan);
  }

  .live-tagline{
    text-align:center;
    font-family: var(--font-display);
    font-size: 1.5rem;
    line-height:1.4;
    margin: 0;
  }

  .live-intro-cta{
    display:block;
    width: 100%;
    max-width: 320px;
    margin: 24px auto 0;
    text-align:center;
  }

  .live-intro-actions{
    display:flex;
    gap: 8px;
    width: 100%;
    max-width: 380px;
    margin: 24px auto 0;
  }
  .live-intro-actions .btn{
    flex: 1;
    aspect-ratio: 1 / 1;
    flex-direction: column;
    gap: 4px;
    padding: 10px 6px;
    font-size: 0.92rem;
    line-height: 1.3;
    text-align: center;
    text-transform: uppercase;
    white-space: normal;
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(70, 212, 222, 0.08);
    transition: transform 0.15s ease;
  }
  .live-intro-actions .btn:active{
    transform: scale(0.93);
  }
  .live-intro-actions .btn svg{
    width: 32px;
    height: 32px;
    margin-bottom: 2px;
    flex-shrink: 0;
    stroke: var(--cyan);
  }

  .live-more-toggle{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    max-width: 380px;
    margin: 14px auto 0;
    background: rgba(70, 212, 222, 0.08);
    border: none;
    cursor: pointer;
    color: rgba(70, 212, 222, 0.55);
    font-family: inherit;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 12px;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .live-more-toggle:active{
    transform: scale(0.97);
    background: rgba(70, 212, 222, 0.18);
  }
  .live-more-toggle svg{
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    transition: transform 0.25s ease;
  }
  .live-more-toggle.is-open svg{ transform: rotate(180deg); }

  .live-intro-actions--more{
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    margin-top: 0;
    transition: max-height 0.3s ease, opacity 0.25s ease, margin-top 0.3s ease;
  }
  .live-intro-actions--more.is-open{
    max-height: 220px;
    opacity: 1;
    margin-top: 8px;
  }

  .live-card{
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(14px, 3.5vh, 22px);
    margin-bottom: clamp(8px, 2vh, 14px);
  }
  .live-card__label{
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }
  .live-card h3{ font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 6px; }
  .live-announcements__status{
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.85rem;
    padding: 24px 0;
  }
  .live-announcements__date{
    font-family: var(--font-mono);
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--cyan);
    text-transform: uppercase;
    margin: 4px 0 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(70, 212, 222, 0.25);
  }
  .live-announcements__title{
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0;
  }
  .live-announcements__title-zh{
    font-family: "Noto Sans TC", sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    opacity: 0.7;
  }
  .live-announcements__content-en{
    margin: 0;
  }
  .live-announcements__content-zh{
    font-family: "Noto Sans TC", sans-serif;
    font-size: 0.92em;
    opacity: 0.8;
    margin: 6px 0 0;
  }
  .live-card p{ color: var(--ink-dim); font-size: 0.9rem; margin: 0; }
  .live-card__link{
    display:inline-block;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--gold);
  }
  .live-card__link:hover{ color: var(--cyan); }

  .live-actions{ display:flex; flex-direction:column; gap: 12px; }
  .live-actions .btn{ width:100%; padding: 15px 20px; font-size: 1rem; }

  .live-contact{ text-align:center; font-size: 0.85rem; color: var(--ink-dim); margin-top: 22px; }
  .live-contact a{ color: var(--gold); }
  .live-contact p{ margin: 6px 0; }

  .live-swipehint{
    text-align:center;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    margin-top: 26px;
  }

  .live-version{
    text-align:center;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
    opacity: 0.6;
    margin: 0;
  }
</style>
</head>
<body>

<div class="grain"></div>

<div class="live-shell">

  <button class="live-arrow live-arrow--prev is-hidden" id="prevBtn" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 18l-6-6 6-6"/>
      <path d="M11 18l-6-6 6-6"/>
    </svg>
  </button>
  <button class="live-arrow live-arrow--next" id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 18l6-6-6-6"/>
      <path d="M13 18l6-6-6-6"/>
    </svg>
  </button>

  <div class="live-track" id="track">

    <!-- Slide 1: Intro -->
    <section class="live-slide live-slide--intro">
      <div class="live-slide__inner">
        <div class="live-header">
          <img src="assets/SFCFC-logo.png?v=2" alt="City Mission logo" class="live-logo">
          <div class="live-clock" id="liveClock">
            <span class="live-clock__time" id="liveClockTime">--:--</span>
            <span class="live-clock__date" id="liveClockDate">-- --- ----</span>
            <span class="live-clock__weather" id="liveClockWeather"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/></svg><span id="liveClockWeatherText">San Francisco · --°F</span></span>
          </div>
        </div>
        <div class="live-intro-actions">
          <a href="https://www.google.com/maps/search/?api=1&query=66+Geneva+Ave%2C+San+Francisco%2C+CA+94112" target="_blank" rel="noopener" class="btn btn--ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            <span class="btn__label">Direction<br>地址</span>
          </a>
          <button type="button" class="btn btn--ghost" id="introBulletinBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M18 6h-3V3"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
            <span class="btn__label">Bulletin<br>週刊</span>
          </button>
          <!-- TODO: replace with the real Zoom meeting link -->
          <a href="YOUR_ZOOM_LINK_HERE" target="_blank" rel="noopener" class="btn btn--ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9z"/></svg>
            <span class="btn__label">Translation<br>翻譯</span>
          </a>
        </div>

        <button type="button" class="live-more-toggle" id="moreToggleBtn" aria-expanded="false" aria-controls="moreActions">
          <span>More 更多</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <div class="live-intro-actions live-intro-actions--more" id="moreActions">
          <button type="button" class="btn btn--ghost" id="introEventBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
            <span class="btn__label">Event<br>活動</span>
          </button>
          <!-- TODO: replace with the real donation/giving link -->
          <a href="YOUR_DONATION_LINK_HERE" target="_blank" rel="noopener" class="btn btn--ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.35-9-8.5C1 7.5 3 4.5 6.5 4.5c1.9 0 3.4 1.1 4.3 2.5.9-1.4 2.4-2.5 4.3-2.5C18.6 4.5 21 7.5 20 11.5 18 15.65 12 20 12 20z"/></svg>
            <span class="btn__label">Donation<br>奉獻</span>
          </a>
          <!-- TODO: replace with the real devotion/devotional-reading link -->
          <a href="YOUR_DEVOTION_LINK_HERE" target="_blank" rel="noopener" class="btn btn--ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3-1.5 6-1.5 8 0v14c-2-1.5-5-1.5-8 0V5z"/><path d="M20 5c-3-1.5-6-1.5-8 0v14c2-1.5 5-1.5 8 0V5z"/></svg>
            <span class="btn__label">Devotion<br>靈修</span>
          </a>

      </div>
    </section>

    <!-- Slide 2: Service info / poster -->
    <section class="live-slide live-slide--poster">
      <div class="live-slide__inner">
        <img src="assets/CityMa_001_cover.jpg?v=2" alt="城市週刊 City Magazine — 以愛承傳 Love Every Generation, SF Chinese Foursquare Church" class="live-poster">
      </div>
    </section>

    <!-- Slide 3: Announcements -->
    <section class="live-slide live-slide--scroll">
      <div class="live-slide__inner">
        <p class="section-label section-label--center">Announcements 報告事項</p>
        <!-- Announcements are loaded from the church's Google Sheet (see script below) -->
        <div id="announcementsList" class="live-announcements">
          <p class="live-announcements__status">Loading announcements… 載入中…</p>
        </div>
      </div>
    </section>

    <!-- Slide 4: Connect -->
    <section class="live-slide">
      <div class="live-slide__inner">
        <p class="section-label section-label--center">Connect 聯絡我們</p>
        <div class="live-actions">
          <a href="index.html#join" class="btn btn--primary">Connect with us 聯絡我們</a>
          <a href="index.html" class="btn btn--ghost">View full site 查看完整網站</a>
        </div>
        <div class="live-contact">
          <p>📍 66 Geneva Ave, San Francisco, CA 94112</p>
          <p>📞 <a href="tel:+14157416053">1-415-741-6053</a></p>
        </div>
      </div>
    </section>

  </div>

  <div class="live-bottom">
    <div class="live-dots" id="dots"></div>
  </div>
  <p class="live-version">v1.43 · updated 2026-09-16</p>
</div>

<script>
  const track = document.getElementById('track');
  const slides = track.querySelectorAll('.live-slide');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  let current = 0;

  slides.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });
  const dots = dotsWrap.querySelectorAll('button');

  function render(){
    dots.forEach((d, i) => d.classList.toggle('is-active', i === current));
    prevBtn.classList.toggle('is-hidden', current === 0);
    nextBtn.classList.toggle('is-hidden', current === slides.length - 1);
  }

  function goTo(index, smooth = true){
    current = Math.max(0, Math.min(slides.length - 1, index));
    track.scrollTo({ left: current * track.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
    render();
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  const introBulletinBtn = document.getElementById('introBulletinBtn');
  if (introBulletinBtn) introBulletinBtn.addEventListener('click', () => goTo(current + 1));

  const introEventBtn = document.getElementById('introEventBtn');
  if (introEventBtn) introEventBtn.addEventListener('click', () => goTo(2));

  // --- Announcements, loaded from a public Google Sheet ---
  // Setup: create a Google Sheet with columns in this order —
  //   Title EN | Title ZH | Date/Time | Content EN | Content ZH
  // Share it as "Anyone with the link can view", then put its ID below
  // (the long ID in the sheet's URL between /d/ and /edit).
  const ANNOUNCEMENTS_SHEET_ID = '1F2atc-BBJk5llQX5u_BSTQ73jhRbZ6Ns5XyNe47IAP8';

  const announcementsListEl = document.getElementById('announcementsList');
  if (announcementsListEl && ANNOUNCEMENTS_SHEET_ID !== 'SHEET_ID_HERE') {
    const sheetUrl = `https://docs.google.com/spreadsheets/d/${ANNOUNCEMENTS_SHEET_ID}/gviz/tq?tqx=out:json`;
    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        // Google wraps the JSON in "google.visualization.Query.setResponse(...)"
        const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
        const rows = json.table.rows || [];
        if (!rows.length) {
          announcementsListEl.innerHTML = '<p class="live-announcements__status">No announcements right now. 目前沒有報告事項。</p>';
          return;
        }
        // If the sheet column is a real Date/Time (not plain text), Google returns it
        // as "Date(year,month,day,hour,minute,second)" — reformat that to mm-dd-yyyy (Ddd) h:mmAM/PM.
        // Plain text entered directly in the sheet is left exactly as typed.
        const formatSheetDate = raw => {
          if (typeof raw !== 'string') return raw;
          const m = raw.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
          if (!m) return raw;
          const [, y, mo, d, h = '0', mi = '0'] = m;
          const dt = new Date(+y, +mo, +d, +h, +mi);
          const mm = String(dt.getMonth() + 1).padStart(2, '0');
          const dd = String(dt.getDate()).padStart(2, '0');
          const weekday = dt.toLocaleDateString('en-US', { weekday: 'short' });
          const hasTime = h !== '0' || mi !== '0';
          if (!hasTime) return `${mm}-${dd}-${dt.getFullYear()} (${weekday})`;
          let hours = dt.getHours() % 12; if (hours === 0) hours = 12;
          const minutes = String(dt.getMinutes()).padStart(2, '0');
          const ampm = dt.getHours() >= 12 ? 'PM' : 'AM';
          return `${mm}-${dd}-${dt.getFullYear()} (${weekday}) ${hours}:${minutes}${ampm}`;
        };
        announcementsListEl.innerHTML = rows.map(row => {
          const cells = row.c || [];
          const get = i => (cells[i] && cells[i].v != null) ? cells[i].v : '';
          const titleEn = get(0), titleZh = get(1), dateTime = formatSheetDate(get(2)), contentEn = get(3), contentZh = get(4);
          return `
            <div class="live-card">
              ${(titleEn || titleZh) ? `<p class="live-announcements__title">${titleEn}${titleZh ? ` <span class="live-announcements__title-zh">${titleZh}</span>` : ''}</p>` : ''}
              ${dateTime ? `<p class="live-announcements__date">${dateTime}</p>` : ''}
              ${contentEn ? `<p class="live-announcements__content-en">${contentEn}</p>` : ''}
              ${contentZh ? `<p class="live-announcements__content-zh">${contentZh}</p>` : ''}
            </div>`;
        }).join('');
      })
      .catch(() => {
        announcementsListEl.innerHTML = '<p class="live-announcements__status">Couldn\'t load announcements right now. 暫時無法載入報告事項。</p>';
      });
  } else if (announcementsListEl) {
    announcementsListEl.innerHTML = '<p class="live-announcements__status">Announcements are not set up yet.</p>';
  }

  const moreToggleBtn = document.getElementById('moreToggleBtn');
  const moreActions = document.getElementById('moreActions');
  if (moreToggleBtn && moreActions) {
    moreToggleBtn.addEventListener('click', () => {
      const isOpen = moreActions.classList.toggle('is-open');
      moreToggleBtn.classList.toggle('is-open', isOpen);
      moreToggleBtn.setAttribute('aria-expanded', String(isOpen));
    });
  }

  // --- live digital clock (Pacific Time, since that's the church's timezone) ---
  const clockTimeEl = document.getElementById('liveClockTime');
  const clockDateEl = document.getElementById('liveClockDate');
  if (clockTimeEl && clockDateEl) {
    const updateClock = () => {
      const now = new Date();
      clockTimeEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'America/Los_Angeles' });
      clockDateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'America/Los_Angeles' });
    };
    updateClock();
    setInterval(updateClock, 1000);
  }

  // --- San Francisco current weather (Open-Meteo: free, no API key) ---
  const weatherIconEl = document.querySelector('#liveClockWeather svg');
  const weatherTextEl = document.getElementById('liveClockWeatherText');
  if (weatherIconEl && weatherTextEl) {
    // maps Open-Meteo WMO weather codes to a simple icon shape
    const weatherIcons = {
      clear: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
      partly: '<path d="M8.5 17H17a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 8 8.5"/><circle cx="7" cy="8" r="3.2"/><path d="M7 3.2V2M2.8 8H2M11.8 4.5l.6-.6M2.8 12.6l-.6.6"/>',
      cloudy: '<path d="M6.5 18H17a3.5 3.5 0 0 0 .5-6.96 5 5 0 0 0-9.62-1.94A4 4 0 0 0 6.5 18z"/>',
      fog: '<path d="M5 10h14M3 14h18M6 18h12"/>',
      rain: '<path d="M7 16H16.5a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 7.5 7.5" /><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/>',
      snow: '<path d="M7 16H16.5a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 7.5 7.5" /><path d="M12 18v4M10 19.5l4 1M14 19.5l-4 1"/>',
      storm: '<path d="M7 14H16.5a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 7.5 5.5" /><path d="M13 15l-3 5h3l-2 4"/>'
    };
    const weatherIconKey = code => {
      if (code === 0) return 'clear';
      if (code === 1 || code === 2) return 'partly';
      if (code === 3) return 'cloudy';
      if (code === 45 || code === 48) return 'fog';
      if ([51,53,55,61,63,65,80,81,82].includes(code)) return 'rain';
      if ([71,73,75].includes(code)) return 'snow';
      if (code === 95) return 'storm';
      return 'cloudy';
    };
    fetch('https://api.open-meteo.com/v1/forecast?latitude=37.7749&longitude=-122.4194&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles')
      .then(res => res.json())
      .then(data => {
        const temp = Math.round(data.current.temperature_2m);
        const tempC = Math.round((data.current.temperature_2m - 32) * 5 / 9);
        const key = weatherIconKey(data.current.weather_code);
        weatherIconEl.innerHTML = weatherIcons[key];
        weatherTextEl.textContent = `San Francisco · ${temp}°F / ${tempC}°C`;
      })
      .catch(() => {
        weatherTextEl.textContent = 'San Francisco · weather unavailable';
      });
  }

  // --- native scroll-snap drives the swipe; we just track where it lands ---
  let scrollTimeout;
  track.addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      const width = track.clientWidth || 1;
      const nearest = Math.round(track.scrollLeft / width);
      current = Math.max(0, Math.min(slides.length - 1, nearest));
      render();
    }, 80);
  }, { passive: true });

  // Keep position correct if the viewport resizes (e.g. orientation change,
  // or the mobile browser's address bar showing/hiding).
  window.addEventListener('resize', () => goTo(current, false));

  // --- keyboard arrows (desktop testing) ---
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });

  render();
</script>
</body>
</html>
